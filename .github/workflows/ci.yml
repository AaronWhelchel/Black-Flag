name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Intelligence Core tests (release gate)
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Build demo
        run: npm run demo
