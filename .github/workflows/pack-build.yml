name: Chart pack build (ENC)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region key from tools/packs/regions.json"
        required: true
        default: nj-manasquan
  schedule:
    # Weekly — matches NOAA ENC re-issue cadence and the Register SRC-01 SLO
    # (pack rebuilt ≤ 7 days after NOAA update).
    - cron: "0 6 * * 1"

jobs:
  selftest:
    # Pipeline self-tests run first — synthetic cell through the full
    # GDAL → tippecanoe path, and catalog discovery against a synthetic
    # catalog. A broken pipeline never touches real cells.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gdal-bin tippecanoe zip unzip
      - run: node tools/packs/selftest.mjs
      - run: node tools/packs/catalog.selftest.mjs

  build:
    needs: selftest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["nj-manasquan","fl-keys-bimini"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gdal-bin tippecanoe zip unzip
      - name: Discover cells from the official NOAA ENC catalog
        run: |
          mkdir -p build
          curl -fsSL -o build/ENCProdCat.xml "https://charts.noaa.gov/ENCs/ENCProdCat_19115.xml"
          ls -la build/ENCProdCat.xml
          # no pipe: catalog.mjs exit codes (incl. exit 3 = no cells) must fail this step
          node tools/packs/catalog.mjs build/ENCProdCat.xml "${{ matrix.region }}" > build/cells.txt
          echo "discovered $(wc -l < build/cells.txt) cells:"; cat build/cells.txt
      - name: Download discovered cells (NOAA, public domain)
        run: |
          mkdir -p build/cells
          ok=0
          while read -r cell; do
            echo "fetching $cell"
            if curl -fsSL -o "build/cells/$cell.zip" "https://charts.noaa.gov/ENCs/$cell.zip"; then
              ok=$((ok+1))
            else
              echo "::warning::cell $cell listed in catalog but download failed — skipped (reported, not hidden)"
              rm -f "build/cells/$cell.zip"
            fi
          done < build/cells.txt
          if [ "$ok" -eq 0 ]; then echo "::error::no cells downloaded — quarantining build (Register R4)"; exit 1; fi
          ls -la build/cells/
      - name: Build pack
        run: node tools/packs/enc.mjs "${{ matrix.region }}" build/cells/*.zip
      - name: Checksum (Register R4 — verify before publish)
        run: |
          cd build/enc/${{ matrix.region }}
          sha256sum *.pmtiles manifest.json > SHA256SUMS
          cat SHA256SUMS
      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: enc-pack-${{ matrix.region }}
          path: build/enc/${{ matrix.region }}
          retention-days: 30
      # Publish step (object storage + CDN) lands with production credentials:
      # a failed checksum or schema gate quarantines — nothing publishes on a
      # warning (Register R4).
