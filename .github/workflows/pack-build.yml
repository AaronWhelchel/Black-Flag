name: Chart pack build (ENC)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region key from tools/packs/regions.json"
        required: true
        default: nj-manasquan
  push:
    branches: [main]
    paths:
      - "tools/packs/**"
      - ".github/workflows/pack-build.yml"
  schedule:
    # Weekly — matches NOAA ENC re-issue cadence and the Register SRC-01 SLO
    # (pack rebuilt ≤ 7 days after NOAA update).
    - cron: "0 6 * * 1"

permissions:
  contents: write   # publish step pushes built packs to pack/<region> branches

jobs:
  selftest:
    # Pipeline self-tests run first — synthetic cell through the full
    # GDAL → tippecanoe path, and catalog discovery against a synthetic
    # catalog. A broken pipeline never touches real cells.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gdal-bin tippecanoe zip unzip
      - run: node tools/packs/selftest.mjs
      - run: node tools/packs/catalog.selftest.mjs

  build:
    needs: selftest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["nj-manasquan","fl-keys-bimini","ky-barkley-lakes"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gdal-bin tippecanoe zip unzip
      - name: Discover cells (NOAA catalog for coastal regions, USACE scheme for rivers)
        run: |
          mkdir -p build
          if node -e "process.exit(require('./tools/packs/regions.json').regions['${{ matrix.region }}'].ienc ? 0 : 1)"; then
            echo "BASE_URL=https://ienccloud.us/ienc/products/files/u37/ienc_s57" >> "$GITHUB_ENV"
            node tools/packs/ienc-cells.mjs "${{ matrix.region }}" > build/cells.txt
          else
            echo "BASE_URL=https://charts.noaa.gov/ENCs" >> "$GITHUB_ENV"
            curl -fsSL -o build/ENCProdCat.xml "https://charts.noaa.gov/ENCs/ENCProdCat_19115.xml"
            # no pipe: catalog.mjs exit codes (incl. exit 3 = no cells) must fail this step
            node tools/packs/catalog.mjs build/ENCProdCat.xml "${{ matrix.region }}" > build/cells.txt
          fi
          echo "discovered $(wc -l < build/cells.txt) candidate cells:"; cat build/cells.txt
      - name: Download cells (NOAA / USACE, public domain)
        run: |
          mkdir -p build/cells
          ok=0
          while read -r cell; do
            echo "fetching $cell from $BASE_URL"
            if curl -fsSL -o "build/cells/$cell.zip" "$BASE_URL/$cell.zip"; then
              ok=$((ok+1))
            else
              echo "::warning::cell $cell unavailable — skipped (reported, not hidden; IENC ranges probe past a river's last cell by design)"
              rm -f "build/cells/$cell.zip"
            fi
          done < build/cells.txt
          if [ "$ok" -eq 0 ]; then echo "::error::no cells downloaded — quarantining build (Register R4)"; exit 1; fi
          ls -la build/cells/
      - name: Build pack
        # redirect (not pipe) so the exit code is preserved; log is published
        # to ci-log/<region> on failure
        run: |
          node tools/packs/enc.mjs "${{ matrix.region }}" build/cells/*.zip > build/build.log 2>&1 || { cat build/build.log; exit 1; }
          cat build/build.log
      - name: Checksum (Register R4 — verify before publish)
        run: |
          cd build/enc/${{ matrix.region }}
          sha256sum *.pmtiles manifest.json > SHA256SUMS
          cat SHA256SUMS
      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: enc-pack-${{ matrix.region }}
          path: build/enc/${{ matrix.region }}
          retention-days: 30
      - name: Publish failure diagnostics to ci-log/<region> branch
        # The Cowork sandbox can reach git but not the Actions API — on
        # failure, push what the build saw so failures are debuggable via git.
        if: failure()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          echo "run ${{ github.run_id }} (${{ github.sha }}) failed $(date -u +%FT%TZ)" > info.txt
          cp "$GITHUB_WORKSPACE/build/cells.txt" . 2>/dev/null || echo "no cells.txt" >> info.txt
          ls -la "$GITHUB_WORKSPACE/build/cells/" > cells-dir.txt 2>&1 || true
          ls -la "$GITHUB_WORKSPACE/build/enc/${{ matrix.region }}/" > enc-dir.txt 2>&1 || true
          cp "$GITHUB_WORKSPACE/build/build.log" . 2>/dev/null || true
          git init -q -b "ci-log/${{ matrix.region }}"
          git -c user.name=ci -c user.email=actions@github.com add -A
          git -c user.name=ci -c user.email=actions@github.com commit -qm "failure log"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-log/${{ matrix.region }}"
      - name: Publish pack to pack/<region> branch (git-accessible distribution)
        # Interim distribution until the CDN lands: each region's pack lives on
        # its own orphan branch, force-pushed whole. Checksums were written in
        # the step above — a failed build never reaches here (Register R4).
        run: |
          cd build/enc/${{ matrix.region }}
          rm -f *.geojson
          git init -q -b "pack/${{ matrix.region }}"
          git -c user.name="pack-bot" -c user.email="actions@github.com" add -A
          git -c user.name="pack-bot" -c user.email="actions@github.com" commit -q -m "ENC pack ${{ matrix.region }} $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/pack/${{ matrix.region }}"
          echo "published refs/heads/pack/${{ matrix.region }}"
